<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Tagline Utama di Browser -->
  <title>Belajaro - Mulai Aja Dulu, Paham Kemudian.</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#F59E0B',
              darkBg: '#0F172A',
              cardBg: '#1E293B',
              lightBg: '#F8FAFC',
              lightCard: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { transition: background-color 0.3s, color 0.3s; }
  </style>
</head>
<body class="bg-brand-darkBg text-slate-100 dark:bg-brand-darkBg dark:text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- ================= HEADER & NAVIGATION ================= -->
  <header class="p-4 flex justify-between items-center max-w-4xl mx-auto w-full">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🏮</span>
      <span class="font-bold text-xl tracking-wide text-amber-500">Belajaro</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- FITUR: Toggle Light/Dark Mode -->
      <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800 dark:bg-slate-700 text-amber-400 border border-slate-700 hover:scale-105 transition">
        <span id="themeIcon">☀️</span>
      </button>

      <!-- FITUR: Portal Tim Access -->
      <button onclick="openAdminModal()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-2 rounded-lg transition">
        🔒 Tim Access
      </button>
    </div>
  </header>

  <!-- ================= HERO & TAGLINE ================= -->
  <main class="max-w-2xl mx-auto px-4 text-center my-auto py-8">
    <h1 class="text-4xl md:text-5xl font-extrabold text-amber-400 mb-2">
      Belajaro
    </h1>
    
    <!-- Tagline Utama -->
    <p class="text-lg md:text-xl text-slate-300 dark:text-slate-300 italic font-medium mb-1">
      "Mulai Aja Dulu, Paham Kemudian."
    </p>
    
    

    <!-- Opsi Pilihan Akses Siswa -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-md mx-auto">
      <button onclick="loginGuest()" class="p-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-left transition shadow-lg">
        <div class="font-bold text-amber-400">Mode Guest 🚀</div>
        <div class="text-xs text-slate-400 mt-1">Coba modul gratis tanpa login</div>
      </button>
      <button onclick="loginMember()" class="p-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-left transition shadow-lg">
        <div>Member Class 🔑</div>
        <div class="text-xs text-slate-900/80 mt-1 font-normal">Akses penuh materi & verifikasi sertifikat</div>
      </button>
    </div>

    <!-- FITUR: Form Cek Validasi Sertifikat -->
    <div class="mt-12 p-4 rounded-xl bg-slate-800/50 dark:bg-slate-800/50 border border-slate-700/50 text-left max-w-md mx-auto">
      <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider mb-2">🎓 Verifikasi Sertifikat Kelulusan</h3>
      <div class="flex gap-2">
        <input type="text" id="certIdInput" placeholder="Masukkan ID Sertifikat (contoh: BLJ-2026-DEMO)" class="w-full text-xs p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-200 focus:outline-none focus:border-amber-500">
        <button onclick="verifyCertificate()" class="bg-amber-500 text-slate-900 px-4 py-2.5 rounded-lg text-xs font-bold hover:bg-amber-400 transition">Cek</button>
      </div>
      <div id="certResult" class="text-xs mt-2 hidden"></div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="text-center p-4 text-xs text-slate-400 dark:text-slate-400">
    © 2026 PT Belajaro Sukses Bersama. All Rights Reserved.
  </footer>

  <!-- ================= FITUR: Tombol Floating WhatsApp (Sesuai Gambar) ================= -->
  <a href="https://wa.me/6281392097113?text=Halo%20Admin%20Belajaro,%20saya%20mau%20tanya%20seputar%20kelas" 
     target="_blank" 
     rel="noopener" 
     class="fixed bottom-5 right-5 bg-slate-200/90 hover:bg-white text-slate-600 font-semibold text-xs py-1.5 pl-1.5 pr-4 rounded-full shadow-xl flex items-center gap-2.5 transition hover:scale-105 z-50 border border-slate-300/50">
    <!-- Ikon Lingkaran Hijau WA -->
    <div class="bg-emerald-500 p-2 rounded-full flex items-center justify-center text-white shadow-sm">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
      </svg>
    </div>
    <!-- Teks Kapsul -->
    <span class="tracking-wide">ADMIN WA</span>
  </a>

  <!-- ================= SCRIPT LOGIKA ================= -->
  <script>
    // 1. Logika Switch Dark / Light Mode
    function toggleTheme() {
      const htmlClass = document.documentElement.classList;
      const themeIcon = document.getElementById('themeIcon');
      
      if (htmlClass.contains('dark')) {
        htmlClass.remove('dark');
        document.body.classList.replace('bg-brand-darkBg', 'bg-slate-100');
        document.body.classList.replace('text-slate-100', 'text-slate-800');
        themeIcon.innerText = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        htmlClass.add('dark');
        document.body.classList.replace('bg-slate-100', 'bg-brand-darkBg');
        document.body.classList.replace('text-slate-800', 'text-slate-100');
        themeIcon.innerText = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    // 2. Portal Tim / Admin
    function openAdminModal() {
      const email = prompt("Portal Tim / Admin Belajaro\nMasukkan Email Tim:");
      if (email) {
        alert("Sistem akan mengarahkan Anda ke Dashboard Manajemen Tim.");
      }
    }

    // 3. Logika Verifikasi ID Sertifikat
    function verifyCertificate() {
      const certId = document.getElementById('certIdInput').value.trim();
      const resultDiv = document.getElementById('certResult');
      
      if (!certId) {
        alert("Silakan masukkan ID Sertifikat.");
        return;
      }
      
      resultDiv.classList.remove('hidden');
      if (certId === "BLJ-2026-DEMO") {
        resultDiv.className = "text-xs mt-2 p-2 bg-emerald-900/50 text-emerald-300 rounded border border-emerald-700";
        resultDiv.innerHTML = "✅ <b>Sertifikat Valid!</b><br>Nama: Siswa Belajaro<br>Kursus: Mandarin HSK 1<br>Diterbitkan: PT Belajaro Sukses Bersama";
      } else {
        resultDiv.className = "text-xs mt-2 p-2 bg-amber-900/50 text-amber-300 rounded border border-amber-700";
        resultDiv.innerHTML = "🔍 ID Sertifikat " + certId + " sedang diverifikasi di database Firestore...";
      }
    }

    function loginGuest() { alert("Masuk sebagai Guest"); }
    function loginMember() { alert("Masuk ke Halaman Login Member"); }
  </script>
</body>
</html>
